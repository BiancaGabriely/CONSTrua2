<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS DA NAVBAR -->
    <link rel="stylesheet" href="../assets/reutilizaveis/navbar/navbar.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>CONSTrua - Aula</title>

    <link rel="stylesheet" href="aula.css">
</head>

<body>

    <div id="navbar-container"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="page">

        <!-- ÁREA DA AULA -->
        <section class="lesson-area">

            <!-- VÍDEO -->
            <div class="video">

                <iframe
                    id="video-aula"
                    width="100%"
                    height="100%"
                    src=""
                    title="Vídeo da aula"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </div>


            <!-- NAVEGAÇÃO DA AULA -->
            <div class="lesson-navigation">

                <button id="btn-anterior" class="nav-lesson">
                    ‹ Anterior
                </button>

                <button id="btn-proxima" class="nav-lesson next">
                    Próxima Aula ›
                </button>

            </div>


            <!-- TÍTULO -->
            <div class="lesson-header">

                <span class="module"></span>

                <h1></h1>

            </div>


            <!-- ABAS -->
            <div class="tabs">

                <button class="tab active" data-tab="recursos">
                    ▣
                    <span>Recursos</span>
                </button>

                <button class="tab" data-tab="notas">
                    ☷
                    <span>Minhas Notas</span>
                </button>

                <button class="tab" data-tab="perguntas">
                    ▢
                    <span>Perguntas e Respostas</span>
                </button>

            </div>


            <!-- RECURSOS -->
            <div id="conteudo-recursos" class="resources">

                <!--
                    Os materiais de apoio serão carregados
                    posteriormente pelo JavaScript.
                -->

            </div>


            <!-- MINHAS NOTAS -->
            <div id="conteudo-notas" style="display: none;">

                <p>
                    Minhas notas
                </p>

            </div>


            <!-- PERGUNTAS E RESPOSTAS -->
            <div id="conteudo-perguntas" style="display: none;">

                <p>
                    Perguntas e respostas
                </p>

            </div>

        </section>


        <!-- SIDEBAR -->
        <aside class="course-sidebar">

            <!-- PROGRESSO -->
            <div class="course-progress">

                <div class="sidebar-title">

                    <strong>
                        Conteúdo do Curso
                    </strong>

                    <span id="contador-progresso">
                        0 / 0 Concluídos
                    </span>

                </div>

                <div class="progress">

                    <div
                        id="barra-progresso"
                        class="progress-bar"
                        style="width: 0%;">
                    </div>

                </div>

            </div>


            <!-- LISTA DE AULAS -->
            <div class="lesson-list">

                <!--
                    Os módulos e aulas serão carregados
                    dinamicamente pelo aula.js.
                -->

            </div>

        </aside>

    </main>


    <!-- NAVBAR JS -->
    <script src="../assets/reutilizaveis/navbar/navbar.js"></script>

    <!-- AULA JS -->
    <script src="aula.js"></script>

</body>

</html>
