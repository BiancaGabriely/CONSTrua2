<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS DA NAVBAR -->
    <link rel="stylesheet" href="../assets/reutilizaveis/navbar/navbar.css">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <title>CONSTrua - Aula</title>

    <link rel="stylesheet" href="aula.css">
</head>

<body>

    <div id="navbar-container"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="page">

        <!-- ÁREA DA AULA -->
        <section class="lesson-area">

            <!-- VÍDEO -->
            <div class="video">

                <iframe id="video-aula" width="100%" height="100%" src="" title="Vídeo da aula" frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen>
                </iframe>

            </div>


            <!-- NAVEGAÇÃO DA AULA -->
            <div class="lesson-navigation">

                <button id="btn-anterior" class="nav-lesson">
                    ‹ Anterior
                </button>

                <button id="btn-proxima" class="nav-lesson next">
                    Próxima Aula ›
                </button>

                <!-- Botão de concluir aula integrado -->
                <button id="btn-concluir" class="btn btn-outline-success ms-2">
                    Marcar como Concluída
                </button>

            </div>


            <!-- TÍTULO -->
            <div class="lesson-header">

                <span class="module"></span>

                <h1></h1>

            </div>


            <!-- ABAS -->
            <div class="tabs">

                <button class="tab active" data-tab="recursos">
                    ▣
                    <span>Recursos</span>
                </button>

                <button class="tab" data-tab="notas">
                    ☷
                    <span>Minhas Notas</span>
                </button>

                <button class="tab" data-tab="perguntas">
                    ▢
                    <span>Perguntas e Respostas</span>
                </button>

            </div>


            <!-- RECURSOS -->
            <div id="conteudo-recursos" class="resources">

                <!--
                    Os materiais de apoio serão carregados
                    posteriormente pelo JavaScript.
                -->

            </div>


            <!-- MINHAS NOTAS -->
            <div id="conteudo-notas" class="mt-3" style="display: none;">
                <textarea id="texto-nota" class="form-control mb-2" rows="4" placeholder="Escreva suas anotações da aula aqui..."></textarea>
                <button id="btn-salvar-nota" class="btn btn-primary btn-sm">Salvar Anotação</button>
            </div>


            <!-- PERGUNTAS E RESPOSTAS -->
            <div id="conteudo-perguntas" class="mt-3" style="display: none;">
                <div class="mb-3">
                    <input type="text" id="nova-pergunta" class="form-control mb-2"
                        placeholder="Tire sua dúvida sobre esta aula...">
                    <button id="btn-enviar-pergunta" class="btn btn-primary btn-sm">Enviar Pergunta</button>
                </div>
                <div id="lista-perguntas" class="mt-3">
                    <p class="text-muted">Nenhuma pergunta enviada ainda.</p>
                </div>
            </div>

        </section>


        <!-- SIDEBAR -->
        <aside class="course-sidebar">

            <!-- PROGRESSO -->
            <div class="course-progress">

                <div class="sidebar-title">

                    <strong>
                        Conteúdo do Curso
                    </strong>

                    <span id="contador-progresso">
                        0 / 0 Concluídos
                    </span>

                </div>

                <div class="progress">

                    <div id="barra-progresso" class="progress-bar" style="width: 0%;">
                    </div>

                </div>

            </div>


            <!-- LISTA DE AULAS -->
            <div class="lesson-list">

                <!--
                    Os módulos e aulas serão carregados
                    dinamicamente pelo aula.js.
                -->

            </div>

        </aside>

    </main>


    <!-- NAVBAR JS -->
    <script src="../assets/reutilizaveis/navbar/navbar.js"></script>

    <!-- AULA JS -->
    <script src="aula.js"></script>

</body>

</html>
